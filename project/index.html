function toast(text,error=false){const n=document.createElement('div');n.className='toast';n.style.background=error?'#a83c4f':'#174c66';n.textContent=text;$('#toastArea').append(n);setTimeout(()=>n.remove(),3800)}
function waits(o){return [o.vendor&&!o.vendorReceived?'Waiting Vendor':null,o.branch&&!o.branchReceived?'Waiting 6th October Branch':null,o.csContact&&!o.csReply?'Waiting Customer Update':null].filter(Boolean)}
function unread(o){return o.replies.filter(r=>r.unread).length}
function badge(o){return `<span class="chip s-${escapeHTML(o.status)}">${escapeHTML(o.status)}</span>`}
function statusBadges(o){return badge(o)}
function chips(o){return waits(o).map(w=>`<span class="chip ${w.includes('Vendor')?'w-vendor':w.includes('Branch')?'w-branch':'w-customer'}">${escapeHTML(w)}</span>`).join('')+(unread(o)?`<span class="chip w-reply">${unread(o)} unread reply</span>`:'')}
function matches(o,v){switch(v){case 'All Orders':return true;case 'Open Orders':return !['Closed','Cancelled'].includes(o.status);case 'Preparing':case 'Complete':case 'Packing':return o.status===v;case 'Waiting Vendor':case 'Waiting 6th October Branch':case 'Waiting Customer Update':return waits(o).includes(v)&&!['Closed','Cancelled'].includes(o.status);case 'Customer Replied':return o.replies.length>0&&!['Closed','Cancelled'].includes(o.status);case 'Closed Orders':return o.status==='Closed';case 'Cancelled':return o.status==='Cancelled';case 'Notifications':return false;case 'Customer Replies':return false;default:return false}}
function count(v){return orders.filter(o=>matches(o,v)).length}
function getOrder(id){return orders.find(o=>o.id===id)}
function note(type,o,text){notifications.unshift({type,id:o.id,text,by:actor(),at:now(),unread:true});renderNotificationCount()}
function audit(o,field,previous,value){let at=now();o.updated=at;o.lastBy=actor();o.history.unshift({field,previous:String(previous??'—'),value:String(value??'—'),by:actor(),at})}
function rememberPosition(){if(!listView(state.view))return;let outer=$('#tableOuter');if(outer)state.listPositions[state.view]={x:outer.scrollLeft,y:outer.scrollTop}}
function restorePosition(){let p=state.listPositions[state.view],outer=$('#tableOuter');if(p&&outer){outer.scrollLeft=p.x;outer.scrollTop=p.y}}
function listView(v){return !['Dashboard','Notifications','Customer Replies'].includes(v)}
function navigate(view){rememberPosition();state.view=view;state.filter='';state.statusFilter='All';state.hidden=new Set();render();window.scrollTo({top:0,behavior:'instant'})}
function renderNavigation(){$('#navigation').innerHTML=names.map(v=>`<button type="button" class="nav-tab ${state.view===v?'active':''}" data-view="${escapeHTML(v)}" ${state.view===v?'aria-current="page"':''}>${escapeHTML(v)}${listView(v)?` <span class="nav-count">${count(v)}</span>`:''}${v==='Notifications'&&notifications.some(n=>n.unread)?'<span class="bubble ml-1">●</span>':''}${v==='Customer Replies'&&notifications.some(n=>n.unread&&n.type==='Customer reply')?'<span class="bubble ml-1">●</span>':''}</button>`).join('')}
function renderNotificationCount(){let n=notifications.filter(x=>x.unread).length;$('#unreadCount').textContent=n;$('#unreadCount').classList.toggle('hidden',!n)}
function render(){renderNavigation();$('#workspace').innerHTML=state.view==='Dashboard'?dashboard():state.view==='Notifications'?notificationPage():state.view==='Customer Replies'?customerRepliesPage():state.view==='Reports'?reports():state.view==='Settings'?settings():orderList();restorePosition();renderNotificationCount();icons()}
function heading(eyebrow,title,sub){return `<div class="eyebrow">${escapeHTML(eyebrow)}</div><h1 class="title">${escapeHTML(title)}</h1><p class="muted mb-4">${escapeHTML(sub)}</p>`}
const summaries=[
['All Orders','Total Orders','Orders across every stage','#286b9e','All workflow records'],
['Preparing','Preparing','Being prepared','#286b9e','Active preparation work'],
['Waiting Vendor','Waiting Vendor','Supplier action required','#96641c','Independent waiting condition'],
['Waiting 6th October Branch','Waiting 6th October Branch','Branch stock required','#a75a25','Independent waiting condition'],
['Waiting Customer Update','Waiting Customer Update','Customer response pending','#a33e83','Follow-up required'],
['Customer Replied','Customer Replied','Replies on open orders','#a33e83','Review newest message'],
['Complete','Complete','Ready to pack','#187558','Preparation finished'],
['Packing','Packing','In packing workflow','#7652a2','Also included in Open Orders'],
['Closed Orders','Closed Orders','Finished and closed','#647282','Historical records'],
['Cancelled','Cancelled Orders','Cancelled separately','#ac4050','Historical records']];
function rangeOrders(){if(state.range==='All dates')return orders;let days=state.range==='Today'?1:state.range==='7 days'?7:30;let cutoff=new Date();cutoff.setUTCDate(cutoff.getUTCDate()-(days-1));return orders.filter(o=>o.date>=cutoff.toISOString().slice(0,10))}
function dashboard(){let selected=rangeOrders(),days=[...new Set(selected.map(o=>o.date))].sort().slice(-7),max=Math.max(1,...days.map(d=>selected.filter(o=>o.date===d).length));let distribution=['Preparing','Complete','Packing','Closed','Cancelled'];return `${heading('Operations / overview','Good morning, Mariam.','Dental supply operations · sample data · changes in this prototype last for this page session')}
<div class="responsive-stack mb-4"><label for="dashRange" class="font-bold">Date range</label><select id="dashRange" class="field">${['Today','7 days','30 days','All dates'].map(x=>`<option ${state.range===x?'selected':''}>${x}</option>`).join('')}</select><span class="note">Dashboard charts reflect the selected creation-date range. Queue counts show current totals.</span></div>
<div class="grid-kpi">${summaries.map(([view,label,desc,color,help])=>`<button type="button" data-view="${view}" class="kpi" style="--accent:${color}"><strong>${count(view)}</strong><span>${label}</span><small>${help} · ${desc}</small></button>`).join('')}</div>
<div class="dashboard-grid"><section class="panel section-pad"><h2 class="section-heading">Order volume over time</h2><p class="note">Created orders by date · hover a bar for its count</p>${days.length?`<div class="chart-bars">${days.map(d=>{let n=selected.filter(o=>o.date===d).length;return `<div class="chart-group" title="${dateFmt(d)}: ${n} created"><div class="chart-bar" style="height:${Math.max(4,n/max*125)}px"></div><small>${d.slice(5)}</small></div>`}).join('')}</div><div class="legend"><span><b style="background:#397bab"></b>Created orders</span></div>`:'<div class="empty">No sample orders were created in this range.</div>'}</section>
<section class="panel section-pad"><h2 class="section-heading">Workflow distribution</h2><p class="note">Current main stage · ${selected.length} orders created in range</p>${distribution.map((v,i)=>`<div class="flex justify-between text-xs mt-3"><span>${v}</span><b>${selected.filter(o=>o.status===v).length}</b></div><div class="meter"><div style="width:${selected.length?selected.filter(o=>o.status===v).length/selected.length*100:0}%;background:${['#286b9e','#187558','#7652a2','#647282','#ac4050'][i]}"></div></div>`).join('')}</section>


<section class="panel section-pad"><h2 class="section-heading">Recently updated</h2>${[...orders].sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,4).map(o=>feedOrder(o)).join('')}</section>
<section class="panel section-pad"><h2 class="section-heading">New orders & customer replies</h2>${[...orders].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,2).map(o=>feedOrder(o)).join('')}${orders.filter(o=>o.replies.length).map(o=>`<div class="feed-row"><div><button class="text-link" data-open="${o.id}">${o.id} · latest reply</button><div class="note">${escapeHTML(o.replies.at(-1).body)}</div></div>${unread(o)?'<span class="chip w-reply">Unread</span>':''}</div>`).join('')}</section>
<section class="panel section-pad"><h2 class="section-heading">Recent activity & notifications</h2>${notifications.slice(0,5).map((n,i)=>`<div class="feed-row"><div><button class="text-link" data-notification="${i}">${escapeHTML(n.type)} · ${n.id}</button><div class="note">${escapeHTML(n.text)} · ${fmt(n.at)}</div></div>${n.unread?'<span class="chip w-reply">New</span>':''}</div>`).join('')}</section>
<section class="panel section-pad"><h2 class="section-heading">Quick actions</h2><div class="responsive-stack mt-3"><button class="btn btn-primary" data-add>+ Add Order</button><button class="btn" data-view="Open Orders">Open orders</button></div><p class="note mt-4">Open Orders includes Preparing, Complete, and Packing; it excludes only Closed and Cancelled.</p></section></div>`}
function feedOrder(o){return `<div class="feed-row"><div><button type="button" class="text-link" data-open="${o.id}">${o.id} · ${escapeHTML(o.clinic)}</button><div class="note">${fmt(o.updated)} · ${escapeHTML(o.lastBy)}</div><div>${badge(o)}${chips(o)}</div></div></div>`}
function selectedCols(){return (scoped[state.view]||columns.map((_,i)=>i)).filter(i=>!state.hidden.has(i))}
function filteredOrders(){let result=orders.filter(o=>matches(o,state.view)&&(!state.filter||`${o.id} ${o.clinic}`.toLowerCase().includes(state.filter.toLowerCase()))&&(state.statusFilter==='All'||o.status===state.statusFilter));result.sort((a,b)=>String(value(a,state.sort)??'').localeCompare(String(value(b,state.sort)??''),undefined,{numeric:true})*(state.descending?-1:1));return result}
function value(o,i){return keys[i]==='replies'?o.replies.map(r=>r.body).join(' • '):o[keys[i]]}
function orderList(){let rows=filteredOrders(),v=state.view;return `${heading('Operations / orders',v,`${rows.length} visible · Select an order for full history and actions`)}<div class="responsive-stack mb-2"><button class="btn btn-primary" data-add>+ Add Order</button>${v==='Open Orders'?'<span class="pill-note">Includes Preparing, Complete and Packing. Only Closed and Cancelled are excluded.</span>':''}${['Closed Orders','Cancelled'].includes(v)?'<span class="pill-note">Historical records · editing is restricted</span>':''}</div>
<div class="toolbar"><label for="listSearch" class="sr-only">Filter by order number or clinic</label><input id="listSearch" class="field" type="search" value="${escapeHTML(state.filter)}" placeholder="Filter number or clinic"><label for="listStatus" class="sr-only">Filter by status</label><select id="listStatus" class="field"><option>All</option>${statuses.map(s=>`<option ${state.statusFilter===s[0]?'selected':''}>${s[0]}</option>`).join('')}</select><button class="btn" id="sortDirection">${icon('arrow-down-up',13)} Sort ${state.descending?'↓':'↑'}</button><div class="relative"><button class="btn" id="columnButton" aria-expanded="false">Columns ▾</button><div id="columnPop" class="pop hidden" style="width:270px">${(scoped[v]||columns.map((_,i)=>i)).map(i=>`<label class="block p-1"><input type="checkbox" class="column-toggle" data-column="${i}" ${!state.hidden.has(i)?'checked':''}> ${escapeHTML(columns[i])}</label>`).join('')}</div></div></div>
<div id="tableOuter" class="table-outer" tabindex="0" aria-label="${escapeHTML(v)} scrollable order table"><table class="data-table"><thead><tr>${selectedCols().map(i=>`<th><button class="text-left font-bold" data-sort="${i}" title="Sort by ${escapeHTML(columns[i])}">${escapeHTML(columns[i])} ↕</button></th>`).join('')}${v==='Complete'||v==='Packing'||v==='Waiting Vendor'||v==='Waiting 6th October Branch'?'<th>Action</th>':''}</tr></thead><tbody id="orderRows">${rows.map(rowHTML).join('')}</tbody></table>${rows.length?'':'<div class="empty">No orders match this view. Try clearing your filters.</div>'}</div><p class="note mt-3">Click editable cells to change them. Waiting badges are independent of the main workflow. Text fields support multiple comments separated by |. Changes are simulated for this page session.</p>`}
function rowHTML(o){let rowClass=o.bl?'row-blacked':o.status==='Cancelled'?'row-cancelled':'';return `<tr data-order="${o.id}"${rowClass?` class="${rowClass}"`:''}>${selectedCols().map(i=>`<td data-col="${i}" class="${![0,1,9,17,19,22,26].includes(i)&&!['Closed','Cancelled'].includes(o.status)?'editable':''}" title="${escapeHTML(i===26?lastChange(o):String(value(o,i)??'Click to edit'))}">${cell(o,i)}</td>`).join('')}${state.view==='Complete'||state.view==='Packing'||state.view==='Waiting Vendor'||state.view==='Waiting 6th October Branch'?`<td>${quickAction(o)}</td>`:''}</tr>`}
function quickAction(o){let a=state.view==='Complete'?'packing':state.view==='Packing'?(o.packedAt?'close':'packed'):state.view==='Waiting Vendor'?'vendor':'branch';let label={packing:'Move to Packing',packed:'Mark as Packed',close:'Close Order',vendor:'Mark vendor received',branch:'Mark branch received'}[a];return `<button type="button" class="btn" data-quick="${a}" data-id="${o.id}">${label}</button>`}
function lastChange(o){let a=o.history[0];return a?`${a.by} · ${a.field}: ${a.previous} → ${a.value} · ${fmt(a.at)}`:`${o.lastBy} · ${fmt(o.updated)}`}
function cell(o,i){let v=value(o,i);if(i===0)return `<input type="checkbox" class="bl-check" data-bl="${o.id}" aria-label="Black list for ${o.id}" ${o.bl?'checked':''}>`;if(i===1)return `<button type="button" class="text-link" data-open="${o.id}">${o.id}</button>${unread(o)?'<span class="chip w-reply">●</span>':''}`;if(i===5)return badge(o)+chips(o);if(i===19)return `<button type="button" class="text-link" data-open="${o.id}" data-highlight="replies">${o.replies.length?`${o.replies.length} repl${o.replies.length===1?'y':'ies'}`:'View replies'}</button>`;if(i===9||i===17)return `<input type="checkbox" class="check" data-check="${i}" data-id="${o.id}" aria-label="${escapeHTML(columns[i])} for ${o.id}" ${v?'checked':''} ${['Closed','Cancelled'].includes(o.status)?'disabled':''}>`;if([2,11,12,13,15,16,18].includes(i))v=dateFmt(v);if([22,26].includes(i))v=fmt(v);return `<span>${escapeHTML(v||'—')}</span>`}
function update(o,key,label,newValue){if(!o||['Closed','Cancelled'].includes(o.status)){toast('Historical orders are read-only.',true);return}let prior=o[key];if(prior===newValue)return;audit(o,label,prior,newValue);o[key]=newValue;if(key==='vendor'||key==='vendorReceived'||key==='branch'||key==='branchReceived'||key==='csContact'||key==='csReply')note('Waiting condition',o,`${label} updated`);if(key==='status')note(newValue,o,`Main workflow moved to ${newValue}`);refreshAffected(o);toast('Saved · '+o.id)}
function refreshAffected(o){rememberPosition();let outer=$('#tableOuter'),row=outer?.querySelector(`tr[data-order="${o.id}"]`),still=listView(state.view)&&matches(o,state.view)&&(!state.filter||`${o.id} ${o.clinic}`.toLowerCase().includes(state.filter.toLowerCase()))&&(state.statusFilter==='All'||o.status===state.statusFilter);if(row&&still){let replacement=document.createElement('tbody');replacement.innerHTML=rowHTML(o);row.replaceWith(replacement.firstElementChild)}else if(row&&!still){row.remove();toast('Order moved out of this filtered view. Your position was kept.')}else if(outer&&still){let holder=document.createElement('tbody');holder.innerHTML=rowHTML(o);$('#orderRows').prepend(holder.firstElementChild)}renderNavigation();renderNotificationCount();if(state.selected===o.id)renderDrawer(o.id,false);restorePosition();icons()}
function editCell(td){let o=getOrder(td.closest('tr').dataset.order),i=Number(td.dataset.col),key=keys[i];if(!o||['Closed','Cancelled'].includes(o.status)||[0,1,9,17,19,22,26].includes(i))return;let opts=i===3?['Before 4 PM','After 4 PM']:i===4?employees.filter(e=>e.active).map(e=>e.name):i===5?['Preparing','Complete','Packing','Cancelled']:i===20?['Not started','In progress','Packed']:i===21?methods.filter(m=>m[2]).map(m=>m[0]):i===23?employees.filter(e=>e.active).map(e=>e.name):null;
let editor=document.createElement(opts?'select':[6,7,8,10,24,25].includes(i)?'textarea':'input');editor.className='cell-editor';editor.setAttribute('aria-label',columns[i]+' for '+o.id);if(opts)editor.innerHTML=opts.map(x=>`<option ${x===o[key]?'selected':''}>${escapeHTML(x)}</option>`).join('');else{editor.type=[2,11,12,13,15,16,17,18].includes(i)?'date':'text';editor.value=o[key]||'';if(editor.tagName==='TEXTAREA')editor.rows=3}td.replaceChildren(editor);editor.focus();if(editor.select&&editor.type==='text')editor.select();let done=false;function commit(cancel=false){if(done)return;done=true;if(cancel){td.innerHTML=cell(o,i);return}let v=editor.value.trim();if(i===5){if(v==='Complete'&&o.status!=='Preparing'||v==='Packing'&&o.status!=='Complete'){toast('Follow Preparing → Complete → Packing.',true);td.innerHTML=cell(o,i);return}if(v==='Packing')o.packing='In progress'}if(i===13&&v&&!o.vendor||i===15&&v&&!o.branch){toast('Add the corresponding products first.',true);td.innerHTML=cell(o,i);return}let mcFields=[6,7,8,10,24,25];if(mcFields.includes(i)&&o[key]&&v&&v!==o[key]){update(o,key,columns[i],o[key]+' | '+v)}else{update(o,key,columns[i],v)}if(!$('#tableOuter')?.querySelector(`tr[data-order="${o.id}"] td[data-col="${i}"] input, tr[data-order="${o.id}"] td[data-col="${i}"] textarea, tr[data-order="${o.id}"] td[data-col="${i}"] select`))return;td.innerHTML=cell(o,i)}editor.addEventListener('blur',()=>commit());editor.addEventListener('keydown',e=>{if(e.key==='Escape')commit(true);if(e.key==='Enter'&&editor.tagName!=='TEXTAREA'){e.preventDefault();commit()}});if(opts||editor.type==='date')editor.addEventListener('change',()=>commit())}
function renderDrawer(id,focus=true){let o=getOrder(id);if(!o)return;state.selected=id;$('#drawerBackdrop').classList.remove('hidden');$('#drawer').innerHTML=drawer(o);icons();if(focus)$('#drawerClose').focus();if(state.highlight){let target=$('#drawer').querySelector(`[data-section="${state.highlight}"]`);target?.scrollIntoView({block:'center'});state.highlight=''}}
function closeDrawer(){state.selected=null;$('#drawerBackdrop').classList.add('hidden')}
function detail(label,v){let d=v?escapeHTML(v).replace(/\| /g,'<hr style="border:0;border-top:1px solid #dbe2e9;margin:6px 0">'):'—';return `<div><div class="detail-label">${escapeHTML(label)}</div><div class="detail-value">${d}</div></div>`}
function drawer(o){let locked=['Closed','Cancelled'].includes(o.status);return `<div class="drawer-head"><div class="flex justify-between gap-2"><div><div class="eyebrow">Order details / ${o.id}</div><h2 class="title">${o.id}</h2><div class="muted">${escapeHTML(o.clinic)}</div></div><button id="drawerClose" class="btn" aria-label="Close order details">✕</button></div><div class="mt-2">${badge(o)}${chips(o)}</div></div><div class="drawer-body">
<section class="panel drawer-section"><h3>Workflow & independent conditions</h3><div class="responsive-stack">${!locked&&o.vendor&&!o.vendorReceived?'<button class="btn" data-action="vendor">Mark vendor received</button>':''}${!locked&&o.branch&&!o.branchReceived?'<button class="btn" data-action="branch">Mark branch received</button>':''}${o.status==='Preparing'?'<button class="btn" data-action="complete">Move to Complete</button>':''}${o.status==='Complete'?'<button class="btn" data-action="packing">Start Packing</button>':''}${o.status==='Packing'&&!o.packedAt?'<button class="btn" data-action="packed">Mark as Packed</button>':''}${o.status==='Packing'&&o.packedAt?'<button class="btn btn-primary" data-action="close">Close Order</button>':''}${!locked?'<button class="btn btn-danger" data-action="cancel">Cancel Order</button>':''}</div><p class="note mt-3">Preparing → Complete → Packing → Closed is the main workflow. Vendor, branch and customer waits can coexist and clear independently. Cancelled is terminal.</p></section>
<section class="panel drawer-section"><h3>Order Information</h3><div class="detail-grid">${detail('Order number',o.id)}${detail('Clinic',o.clinic)}${detail('Created',fmt(o.createdAt))}${detail('Created by',o.createdBy)}${detail('Order cut-off',o.cutoff)}${detail('Main status',o.status)}${o.closedAt?detail('Closed / by',fmt(o.closedAt)+' · '+o.closedBy):''}${o.cancelledAt?detail('Cancelled / by',fmt(o.cancelledAt)+' · '+o.cancelledBy):''}${o.cancelReason?detail('Cancellation reason',o.cancelReason):''}</div></section>
<section class="panel drawer-section"><h3>Preparation</h3><div class="detail-grid">${detail('Responsible',o.responsible)}${detail('Shortages',o.shortages)}${detail('Unavailable products',o.unavailable)}${detail('Team notes',o.notes)}${detail('OPP',o.opp?'Checked':'Unchecked')}</div></section>
<section class="panel drawer-section"><h3>Vendor Products</h3><div class="detail-grid">${detail('Products',o.vendor)}${detail('Request date',dateFmt(o.vendorRequest))}${detail('Reply date',dateFmt(o.vendorReply))}${detail('Received date',dateFmt(o.vendorReceived))}</div></section>
<section class="panel drawer-section"><h3>6th October Branch Products</h3><div class="detail-grid">${detail('Products',o.branch)}${detail('Received date',dateFmt(o.branchReceived))}</div></section>
<section class="panel drawer-section"><h3>Customer Service</h3><div class="detail-grid">${detail('CS contact date',dateFmt(o.csContact))}${detail('CHAT',o.chat?'Checked':'Unchecked')}${detail('CS reply date',dateFmt(o.csReply))}${detail('Customer condition',waits(o).includes('Waiting Customer Update')?'Waiting Customer Update':o.replies.length?'Customer Replied':'No active wait')}</div></section>
<section class="panel drawer-section" data-section="replies"><div class="flex justify-between gap-2"><h3>Customer Replies · ${o.replies.length}</h3>${unread(o)?'<button class="btn" data-action="read">Mark replies read</button>':''}</div>${o.replies.length?o.replies.slice().reverse().map((r,i)=>`<div class="reply ${r.unread?'unread':''}"><div class="flex justify-between gap-2"><b>${escapeHTML(r.by)} ${i===0?'· Latest':''}</b>${r.unread?'<span class="chip w-reply">NEW</span>':''}</div><div class="note">${fmt(r.at)}</div><div class="mt-2">${escapeHTML(r.body)}</div></div>`).join(''):'<p class="note">No replies recorded.</p>'}${!locked?`<form id="replyForm"><label for="replyInput" class="block font-bold mt-3">Append customer reply</label><textarea id="replyInput" class="field w-full mt-2" maxlength="1000" rows="3" required placeholder="Record the customer's message"></textarea><button type="submit" class="btn btn-primary mt-2">Add reply</button></form>`:''}</section>
<section class="panel drawer-section"><h3>Packing and Shipping</h3><div class="detail-grid">${detail('Packing status',o.packing)}${detail('Shipping method',o.shipping)}${detail('Packed at',fmt(o.packedAt))}${detail('Packed by',o.packedBy)}</div>${!locked?`<label for="drawerShipping" class="block font-bold mt-4">Change shipping method</label><select id="drawerShipping" class="field mt-1">${methods.filter(m=>m[2]||m[0]===o.shipping).map(m=>`<option ${o.shipping===m[0]?'selected':''}>${escapeHTML(m[0])}</option>`).join('')}</select>`:''}</section>
<section class="panel drawer-section"><h3>Audit and Feedback</h3><div class="detail-grid">${detail('Audit comment',o.auditComment)}${detail('Operation feedback',o.feedback)}${detail('Last update',fmt(o.updated))}${detail('Updated by',o.lastBy)}</div></section>
<section class="panel drawer-section"><h3>Activity History</h3>${o.history.length?o.history.map(h=>`<div class="feed-row"><div><b>${escapeHTML(h.by)}</b> changed ${escapeHTML(h.field)}<div class="note">${escapeHTML(h.previous)} → ${escapeHTML(h.value)}</div><div class="note">${fmt(h.at)}</div></div></div>`).join(''):'<p class="note">No edits recorded in this session.</p>'}<h3 class="mt-4">Recent notifications</h3>${notifications.filter(n=>n.id===o.id).slice(0,4).map(n=>`<div class="feed-row"><div>${escapeHTML(n.type)} · ${escapeHTML(n.text)}<div class="note">${escapeHTML(n.by)} · ${fmt(n.at)}</div></div></div>`).join('')||'<p class="note">None yet.</p>'}</section></div>`}
function confirmDialog(title,text,onConfirm,reason=false){$('#modal').innerHTML=`<h2 class="section-heading">${escapeHTML(title)}</h2><p class="muted">${escapeHTML(text)}</p>${reason?'<label for="confirmReason">Cancellation reason</label><textarea id="confirmReason" class="field" rows="3" required maxlength="400"></textarea>':''}<div class="responsive-stack justify-end mt-5"><button id="modalCancel" class="btn">Keep order</button><button id="modalConfirm" class="btn btn-danger">Confirm</button></div>`;$('#modalBackdrop').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#modalConfirm').onclick=()=>{let why=reason?$('#confirmReason').value.trim():'';if(reason&&!why){toast('Enter a cancellation reason.',true);$('#confirmReason').focus();return}closeModal();onConfirm(why)};$('#modalCancel').focus()}
function closeModal(){$('#modalBackdrop').classList.add('hidden')}
function orderAction(kind,o){if(!o||['Closed','Cancelled'].includes(o.status))return;let d=today();if(kind==='vendor'){if(!o.vendor)return toast('Add vendor products first.',true);update(o,'vendorReceived','Supplier Product Received Date',d)}
if(kind==='branch'){if(!o.branch)return toast('Add branch products first.',true);update(o,'branchReceived','6th October Received Date',d)}
if(kind==='complete'&&o.status==='Preparing')update(o,'status','Order Status','Complete');
if(kind==='packing'&&o.status==='Complete'){o.packing='In progress';update(o,'status','Order Status','Packing')}
if(kind==='packed'&&o.status==='Packing'){let t=now();audit(o,'Packing Status',o.packing,'Packed');o.packing='Packed';o.packedBy=actor();update(o,'packedAt','Packed At',t);note('Packed',o,`Packed by ${actor()}; order remains open`)}
if(kind==='close'&&o.status==='Packing'){if(!o.packedAt)return toast('Mark as Packed before closing.',true);confirmDialog('Close order?',`Close ${o.id}? The order will become read-only.`,()=>{o.closedAt=now();o.closedBy=actor();audit(o,'Order Status',o.status,'Closed');o.status='Closed';note('Closed',o,'Order closed');refreshAffected(o);toast('Order closed')})}
if(kind==='cancel')confirmDialog('Cancel order?',`Cancel ${o.id}? This is a terminal historical state.`,why=>{o.cancelReason=why;o.cancelledAt=now();o.cancelledBy=actor();audit(o,'Order Status',o.status,'Cancelled');o.status='Cancelled';note('Cancelled',o,why);refreshAffected(o);toast('Order cancelled')},true);
if(kind==='read'){o.replies.forEach(r=>r.unread=false);notifications.filter(n=>n.id===o.id&&n.type==='Customer reply').forEach(n=>n.unread=false);refreshAffected(o);toast('Replies marked read')}}
function addOrderDialog(){let nextNum=getNextOrderNumber();$('#modal').innerHTML=`<h2 class="section-heading">Add Order</h2><p class="note">Enter the order number or use the suggested next number. Format: OR-XXXX.</p><form id="addForm"><label for="newOrderNum">Order number</label><div class="flex items-center gap-2"><span class="font-bold text-lg">OR-</span><input id="newOrderNum" class="field" required maxlength="10" placeholder="${nextNum}" value="${nextNum}"></div><label for="newClinic">Clinic name</label><input id="newClinic" class="field" required maxlength="90" placeholder="Dental clinic"><label for="newResponsible">Preparation responsible</label><select id="newResponsible" class="field">${employees.filter(e=>e.active).map(e=>`<option>${escapeHTML(e.name)}</option>`).join('')}</select><label for="newShipping">Shipping method</label><select id="newShipping" class="field">${methods.filter(m=>m[2]).map(m=>`<option>${escapeHTML(m[0])}</option>`).join('')}</select><div class="responsive-stack justify-end mt-5"><button type="button" class="btn" id="modalCancel">Cancel</button><button type="submit" class="btn btn-primary">Create order</button></div></form>`;$('#modalBackdrop').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#newOrderNum').focus();$('#newOrderNum').select()}
function getNextOrderNumber(){let nums=orders.map(o=>{let m=o.id.match(/OR-(\d+)/);return m?Number(m[1]):0});let max=nums.length?Math.max(...nums):0;let next=max+1;return String(next).padStart(4,'0')}
function createOrder(){let numInput=$('#newOrderNum').value.trim();if(!numInput)return toast('Order number is required.',true);let orderId='OR-'+numInput.replace(/^OR-/, '');if(getOrder(orderId))return toast('Order number already exists.',true);let clinic=$('#newClinic').value.trim();if(!clinic)return toast('Clinic name is required.',true);let o=make(orderId,clinic,today(),$('#newResponsible').value,'Preparing',{createdAt:now(),createdBy:actor(),lastBy:actor(),updated:now(),shipping:$('#newShipping').value});orders.unshift(o);note('New order',o,`Order created for ${clinic}`);closeModal();rememberPosition();state.view='All Orders';state.filter='';state.statusFilter='All';render();renderDrawer(o.id);toast(`Created ${o.id}`)}
function notificationPage(){return `${heading('Operations / event history','Notifications',`${notifications.filter(n=>n.unread).length} unread · Read items remain available in history`)}<button class="btn mb-4" id="readAll">Mark all as read</button><div class="panel section-pad">${notifications.length?notifications.map((n,i)=>`<button class="pop-item" data-notification="${i}" style="${n.unread?'border-left:3px solid #ad4b89;background:#fcf6fa':''}"><div class="flex justify-between gap-2"><b>${escapeHTML(n.type)} · ${n.id}</b>${n.unread?'<span class="chip w-reply">Unread</span>':'<span class="note">Read</span>'}</div><div>${escapeHTML(n.text)}</div><div class="note">${escapeHTML(n.by)} · ${fmt(n.at)}</div></button>`).join(''):'<div class="empty">No notifications yet.</div>'}</div>`}
function customerRepliesPage(){let cr=notifications.filter(n=>n.type==='Customer reply');return `${heading('Operations / customer replies','Customer Replies',`${cr.filter(n=>n.unread).length} unread · Customer reply notifications only`)}<button class="btn mb-4" id="readAll">Mark all as read</button><div class="panel section-pad">${cr.length?cr.map(n=>{let idx=notifications.indexOf(n);return `<button class="pop-item" data-notification="${idx}" style="${n.unread?'border-left:3px solid #ad4b89;background:#fcf6fa':''}"><div class="flex justify-between gap-2"><b>${escapeHTML(n.type)} · ${n.id}</b>${n.unread?'<span class="chip w-reply">Unread</span>':'<span class="note">Read</span>'}</div><div>${escapeHTML(n.text)}</div><div class="note">${escapeHTML(n.by)} · ${fmt(n.at)}</div></button>`}).join(''):'<div class="empty">No customer reply notifications.</div>'}</div>`}
function notificationPop(){let list=$('#notificationPop');list.innerHTML=`<div class="flex justify-between items-center p-2"><b>Notifications</b><button class="text-link" id="allNotifications">View all</button></div>${notifications.slice(0,5).map((n,i)=>`<button class="pop-item" data-notification="${i}">${n.unread?'● ':''}<b>${escapeHTML(n.type)} · ${n.id}</b><div class="note">${escapeHTML(n.text)}</div></button>`).join('')}`}
function searchResults(){let q=$('#globalSearch').value.trim().toLowerCase(),out=$('#searchResults');$('#globalSearch').setAttribute('aria-expanded',String(Boolean(q)));if(!q){out.classList.add('hidden');return}let found=orders.filter(o=>o.id.toLowerCase().includes(q)).slice(0,8);out.innerHTML=found.length?found.map(o=>`<button class="pop-item" role="option" data-open="${o.id}"><b>${o.id}</b> · ${escapeHTML(o.clinic)}<div>${badge(o)}${chips(o)}</div></button>`).join(''):'<div class="empty">No matching order numbers.</div>';out.classList.remove('hidden')}
function reportRows(){let f=state.reportFilters;return orders.filter(o=>(!f.from||o.date>=f.from)&&(!f.to||o.date<=f.to)&&(!f.number||o.id.toLowerCase().includes(f.number.toLowerCase()))&&(!f.responsible||o.responsible===f.responsible)&&(!f.worker||workers(o).includes(f.worker))&&(!f.packedBy||o.packedBy===f.packedBy)&&(!f.shipping||o.shipping===f.shipping)&&(f.status==='All'||o.status===f.status))}
function workers(o){return [...new Set([o.createdBy,o.responsible,o.packedBy,o.closedBy,...o.history.map(h=>h.by),...o.replies.map(r=>r.by)].filter(Boolean))]}
function duration(a,b){return a&&b?Math.max(0,(new Date(b)-new Date(a))/3600000):null}
function avg(values){let nums=values.filter(x=>x!==null);return nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1)+' h':'—'}
function reports(){let rows=reportRows(),f=state.reportFilters;return `${heading('Analysis / sample reports','Reports','Prototype/demo data · not production analytics')}<div class="pill-note mb-4">Production calculations require persisted Django records, actual timestamps, historical audit events, and server-side permission enforcement. Blank timestamps are never estimated.</div><div class="responsive-stack mb-4">${['Order Lifecycle','Employee Performance','Monthly Export'].map(x=>`<button class="btn ${state.report===x?'btn-primary':''}" data-report="${x}">${x}</button>`).join('')}</div>${state.report==='Monthly Export'?exportPanel():`<div class="panel section-pad mb-4"><h2 class="section-heading">Report filters</h2><div class="responsive-stack"><label>From <input id="r-from" type="date" class="field report-filter" value="${f.from}"></label><label>To <input id="r-to" type="date" class="field report-filter" value="${f.to}"></label>${state.report==='Order Lifecycle'?`<label>Order number <input id="r-number" class="field report-filter" value="${escapeHTML(f.number)}" placeholder="OR-…"></label>${reportSelect('responsible','Preparation responsible',employees.map(e=>e.name))}${reportSelect('worker','Worked on order',employees.map(e=>e.name))}${reportSelect('packedBy','Packed by',employees.map(e=>e.name))}${reportSelect('shipping','Shipping method',methods.map(m=>m[0]))}${reportSelect('status','Current status',['All',...statuses.map(s=>s[0])])}`:`${reportSelect('employee','Employee',['All',...employees.map(e=>e.name)])}${reportSelect('role','Role',['All',...new Set(employees.map(e=>e.role))])}`}</div></div>${state.report==='Order Lifecycle'?lifecycle(rows):performance(rows)}`}`}
function reportSelect(key,label,items){let v=state.reportFilters[key];return `<label>${label} <select id="r-${key}" class="field report-filter">${!['status','employee','role'].includes(key)?'<option value="">All</option>':''}${items.map(x=>`<option value="${escapeHTML(x)}" ${v===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></label>`}
function miniMetric(label,v){return `<div class="panel p-4"><div class="note">${label}</div><b class="text-xl">${escapeHTML(v)}</b></div>`}
function lifecycle(rows){return `<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-2 mb-4">${miniMetric('Created',rows.length)}${miniMetric('Packed',rows.filter(o=>o.packedAt).length)}${miniMetric('Closed',rows.filter(o=>o.closedAt).length)}${miniMetric('Cancelled',rows.filter(o=>o.status==='Cancelled').length)}${miniMetric('Avg. creation → packing',avg(rows.map(o=>duration(o.createdAt,o.packedAt))))}${miniMetric('Avg. creation → closure',avg(rows.map(o=>duration(o.createdAt,o.closedAt))))}</div><div class="table-outer"><table class="data-table"><thead><tr>${['Order Number','Created at','Preparation responsible','Employees who worked on it','Packed by','Packing date/time','Closure date/time','Shipping method','Creation → packing','Creation → closure','Current status'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(o=>`<tr><td><button class="text-link" data-open="${o.id}">${o.id}</button></td><td>${fmt(o.createdAt)}</td><td>${escapeHTML(o.responsible)}</td><td>${escapeHTML(workers(o).join(', '))}</td><td>${escapeHTML(o.packedBy||'Not Yet Packed')}</td><td>${o.packedAt?fmt(o.packedAt):'Not Yet Packed'}</td><td>${o.closedAt?fmt(o.closedAt):'Not Yet Closed'}</td><td>${escapeHTML(o.shipping)}</td><td>${duration(o.createdAt,o.packedAt)===null?'Not Yet Packed':duration(o.createdAt,o.packedAt).toFixed(1)+' h'}</td><td>${duration(o.createdAt,o.closedAt)===null?'Not Yet Closed':duration(o.createdAt,o.closedAt).toFixed(1)+' h'}</td><td>${badge(o)}</td></tr>`).join('')}</tbody></table>${!rows.length?'<div class="empty">No orders match these report filters.</div>':''}</div>`}
function performance(rows){let f=state.reportFilters,people=employees.filter(e=>(f.employee==='All'||e.name===f.employee)&&(f.role==='All'||e.role===f.role)),max=Math.max(1,...people.map(e=>rows.filter(o=>workers(o).includes(e.name)).length));return `<div class="panel section-pad mb-4"><h2 class="section-heading">Employee workload</h2>${people.map(e=>{let n=rows.filter(o=>workers(o).includes(e.name)).length;return `<div class="flex justify-between mt-3"><span>${escapeHTML(e.name)} · ${escapeHTML(e.role)}</span><b>${n}</b></div><div class="meter"><div style="width:${n/max*100}%;background:#286b9e"></div></div>`}).join('')||'<div class="empty">No employees match.</div>'}</div><div class="table-outer"><table class="data-table"><thead><tr>${['Employee','Role','Orders created','Worked on','Prepared','Packed','Closed','Avg. processing time','Avg. creation → packing','Total completed work','Drill-down'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${people.map(e=>{let work=rows.filter(o=>workers(o).includes(e.name)),prepared=rows.filter(o=>o.responsible===e.name&&['Complete','Packing','Closed'].includes(o.status)),packed=rows.filter(o=>o.packedBy===e.name&&o.packedAt),closed=rows.filter(o=>o.closedBy===e.name&&o.closedAt);return `<tr><td>${escapeHTML(e.name)}</td><td>${escapeHTML(e.role)}</td><td>${rows.filter(o=>o.createdBy===e.name).length}</td><td>${work.length}</td><td>${prepared.length}</td><td>${packed.length}</td><td>${closed.length}</td><td>${avg(work.map(o=>duration(o.createdAt,o.closedAt)))}</td><td>${avg(packed.map(o=>duration(o.createdAt,o.packedAt)))}</td><td>${prepared.length+packed.length+closed.length}</td><td><button class="text-link" data-drill="${escapeHTML(e.name)}">View orders</button></td></tr>`}).join('')}</tbody></table></div><p class="note mt-3">Worked on = creator, preparation owner, packing/closure employee, reply author, or audit actor. Prepared = assigned orders reaching Complete or later. Total completed work = prepared + packed + closed actions. Average processing time uses valid creation-to-closure durations only.</p>`}
function exportPanel(){let rows=orders.filter(o=>o.date.startsWith(state.exportMonth)&&(state.exportScope==='All'||state.exportScope==='Active / Packing'?!['Closed','Cancelled'].includes(o.status):o.status===state.exportScope));return `<div class="panel section-pad"><h2 class="section-heading">Monthly Order Export</h2><div class="responsive-stack mt-4"><label>Month <input id="exportMonth" type="month" class="field" value="${state.exportMonth}"></label><label>Include <select id="exportScope" class="field">${['All','Active / Packing','Closed','Cancelled'].map(x=>`<option ${state.exportScope===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="pill-note mt-4">${rows.length} matching order${rows.length===1?'':'s'} · all 26 order fields plus clinic, creator, lifecycle dates, and cancellation history are included.</p><div class="responsive-stack mt-4"><button class="btn btn-primary" data-export="csv">Download CSV</button><button class="btn" data-export="xls">Download spreadsheet (.xls)</button></div><p class="note mt-3">The spreadsheet download is an Excel-compatible .xls file. Production exports require backend permission checks.</p><h3 class="section-heading mt-5">Selected-filter preview</h3>${rows.slice(0,6).map(feedOrder).join('')||'<div class="empty">No orders in the selected month and scope.</div>'}</div>`}
function exportRows(type){let rows=orders.filter(o=>o.date.startsWith(state.exportMonth)&&(state.exportScope==='All'||state.exportScope==='Active / Packing'?!['Closed','Cancelled'].includes(o.status):o.status===state.exportScope));let headers=[...columns,'Clinic','Created At','Created By','Closed At','Closed By','Cancelled At','Cancelled By','Cancellation Reason'];let values=rows.map(o=>[...keys.map(k=>k==='replies'?o.replies.map(r=>`${r.body} (${r.by}, ${r.at})`).join(' | '):o[k]),o.clinic,o.createdAt,o.createdBy,o.closedAt,o.closedBy,o.cancelledAt,o.cancelledBy,o.cancelReason].map(v=>String(v??'')));let content,mime,ext;if(type==='csv'){content='\ufeff'+[headers,...values].map(row=>row.map(v=>`"${v.replaceAll('"','""')}"`).join(',')).join('\r\n');mime='text/csv;charset=utf-8';ext='csv'}else{content=`<html><head><meta charset="utf-8"></head><body><table><tr>${headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr>${values.map(row=>`<tr>${row.map(v=>`<td>${escapeHTML(v)}</td>`).join('')}</tr>`).join('')}</table></body></html>`;mime='application/vnd.ms-excel;charset=utf-8';ext='xls'}let url=URL.createObjectURL(new Blob([content],{type:mime}));let a=document.createElement('a');a.href=url;a.download=`MediSTA-orders-${state.exportMonth}.${ext}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`Downloaded ${ext.toUpperCase()} export`)}
const settingsSections=['Employee Management','Employee Profile','Role and Field-Level Permissions','Workflow Status Management','Shipping Method Management','General Settings','Notification Preferences'];
function settings(){return `${heading('Administration / prototype','Settings','Demonstration controls · production access must be enforced in Django')}<div class="settings-layout"><nav class="panel settings-side" aria-label="Settings sections">${settingsSections.map(s=>`<button type="button" class="${state.setting===s?'active':''}" data-setting="${s}">${s}</button>`).join('')}</nav><section class="panel section-pad">${settingContent()}</section></div>`}
function settingContent(){switch(state.setting){
case 'Employee Management':return `<div class="flex justify-between gap-2 items-center"><div><h2 class="section-heading">Employee Management</h2><p class="note">Roles can be extended in a production implementation.</p></div><button class="btn btn-primary" data-employee-add>+ Add employee</button></div><div class="overflow-auto mt-4"><table class="permission-table w-full"><thead><tr>${['Name','Email','Role','State','Last active','Actions'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${employees.map((e,i)=>`<tr><td><b>${escapeHTML(e.name)}</b></td><td>${escapeHTML(e.email)}</td><td>${escapeHTML(e.role)}</td><td><span class="chip ${e.active?'s-Complete':'s-Closed'}">${e.active?'Active':'Inactive'}</span></td><td>${escapeHTML(e.last)}</td><td><button class="btn" data-employee-edit="${i}">Edit</button> <button class="btn" data-employee-toggle="${i}">${e.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div><p class="note mt-4">Password setup is a secure backend responsibility; no passwords are collected in this prototype.</p>`;
case 'Employee Profile':return `<h2 class="section-heading">Employee Profile</h2><p class="note">Current employee · ${escapeHTML(employees[0].role)} · ${escapeHTML(employees[0].email)}</p><form id="profileForm" class="mt-4"><label for="displayName" class="block font-bold">Display name</label><input id="displayName" class="field mt-2" maxlength="70" required value="${escapeHTML(employees[0].name)}"><div class="mt-3"><button class="btn btn-primary" type="submit">Save display name</button></div></form><div class="pill-note mt-5">Password changes require a secure backend account service.</div>`;
case 'Role and Field-Level Permissions':{let groups={'Preparation':['Preparation notes','Shortages','Unavailable products','OPP','Vendor waiting','Branch waiting'],'Customer Service':['CS dates','CHAT','Customer replies','Customer waiting'],'Packing':['Packing status','Shipping method','Packed at','Packed by'],'General':['All-order visibility','Create orders','Main status','Close orders','Cancel orders','Audit and feedback'],'Reports':['Reports page','Exports'],'Administration':['Employee management','Settings management']};return `<h2 class="section-heading">Role and Field-Level Permissions</h2><p class="pill-note mt-3">All employees can view orders by default. These switches illustrate proposed access; hiding a control is not security. Enforce permissions server-side.</p><label class="block mt-4">Role <select id="permissionRole" class="field ml-2">${[...new Set(employees.map(e=>e.role))].map(r=>`<option>${escapeHTML(r)}</option>`).join('')}</select></label><div class="overflow-auto mt-4"><table class="permission-table w-full"><thead><tr><th>Group / page / field / action</th><th>View / Allow</th><th>Edit</th></tr></thead><tbody>${Object.entries(groups).map(([group,items])=>`<tr><th colspan="3">${group}</th></tr>${items.map(item=>`<tr><td>${item}</td>${['View','Edit'].map(type=>`<td><input type="checkbox" class="check permission-switch" data-permission="${escapeHTML(group+'|'+item+'|'+type)}" aria-label="${type} ${escapeHTML(item)}" ${type==='View'||group==='Preparation'&&type==='Edit'?'checked':''}></td>`).join('')}</tr>`).join('')}`).join('')}</tbody></table></div>`}
case 'Workflow Status Management':return manager('Workflow statuses','status',statuses,'Changes to a status definition must not rewrite historical order records. Allowed role transitions require backend validation.');
case 'Shipping Method Management':return manager('Shipping methods','method',methods,'Inactive methods remain visible on historical orders.');
case 'General Settings':return `<h2 class="section-heading">General Settings</h2><div class="responsive-stack mt-4"><label>Timezone <select class="field general-setting"><option>Africa/Cairo</option><option>UTC</option></select></label><label>Date display <select class="field general-setting"><option>DD MMM YYYY</option><option>YYYY-MM-DD</option></select></label><label>Default table sort <select class="field general-setting"><option>Newest order first</option><option>Oldest order first</option></select></label><label>Export preference <select class="field general-setting"><option>CSV</option><option>Spreadsheet (.xls)</option></select></label></div><p class="note mt-4">These controls illustrate organization preferences.</p>`;
case 'Notification Preferences':return `<h2 class="section-heading">Notification Preferences</h2>${Object.entries(preferences).map(([label,on])=>`<label class="flex justify-between items-center border-b py-3"><span>${escapeHTML(label)}</span><input type="checkbox" class="check preference-switch" data-pref="${escapeHTML(label)}" ${on?'checked':''}></label>`).join('')}<p class="note mt-4">Changing a preference does not remove existing notification history.</p>`}}
function manager(title,kind,items,help){return `<div class="flex justify-between gap-2"><div><h2 class="section-heading">${title}</h2><p class="note">${help}</p></div><button class="btn btn-primary" data-manager-add="${kind}">+ Add</button></div>${items.map((item,i)=>`<div class="feed-row items-center"><div class="responsive-stack"><span style="display:inline-block;width:15px;height:15px;background:${item[1]};border-radius:4px"></span><b>${escapeHTML(item[0])}</b><span class="chip ${item[2]?'s-Complete':'s-Closed'}">${item[2]?'Active':'Inactive'}</span></div><div class="responsive-stack"><button class="btn" data-manager-edit="${kind}|${i}">Edit</button><button class="btn" data-manager-toggle="${kind}|${i}">${item[2]?'Deactivate':'Activate'}</button></div></div>`).join('')}`}
function entityDialog(kind,index=-1){let employee=kind==='employee',items=kind==='status'?statuses:methods,item=employee?employees[index]:items[index];$('#modal').innerHTML=`<h2 class="section-heading">${index<0?'Add':'Edit'} ${employee?'employee':kind}</h2><form id="entityForm"><label for="entityName">Name</label><input id="entityName" class="field" maxlength="70" required value="${escapeHTML(employee?item?.name||'':item?.[0]||'')}">${employee?`<label for="entityEmail">Email</label><input id="entityEmail" class="field" type="email" required value="${escapeHTML(item?.email||'')}"><label for="entityRole">Role</label><input id="entityRole" class="field" required maxlength="50" value="${escapeHTML(item?.role||'Preparation')}" placeholder="Existing or future role"><p class="note">Secure password setup is not available in this prototype.</p>`:`<label for="entityColor">Badge color</label><input id="entityColor" type="color" class="field" value="${escapeHTML(item?.[1]||'#2767a1')}">`}<div class="responsive-stack justify-end mt-5"><button type="button" class="btn" id="modalCancel">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`;$('#modalBackdrop').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#entityName').focus();$('#entityForm').onsubmit=e=>{e.preventDefault();let name=$('#entityName').value.trim();if(!name)return toast('A name is required.',true);if(employee){let email=$('#entityEmail').value.trim(),role=$('#entityRole').value.trim();if(employees.some((x,i)=>i!==index&&x.email.toLowerCase()===email.toLowerCase()))return toast('Email already exists.',true);if(index<0)employees.push({name,email,role,active:true,last:'Not yet active'});else Object.assign(employees[index],{name,email,role})}else{if(items.some((x,i)=>i!==index&&x[0].toLowerCase()===name.toLowerCase()))return toast('Name already exists.',true);if(index<0)items.push([name,$('#entityColor').value,true]);else{items[index][0]=name;items[index][1]=$('#entityColor').value}}closeModal();render();toast('Saved in prototype session')}}
document.addEventListener('click',e=>{
let v=e.target.closest('[data-view]');if(v){if(v.dataset.setting)state.setting=v.dataset.setting;navigate(v.dataset.view);$('#profilePop').classList.add('hidden');return}
if(e.target.closest('#home')){navigate('Dashboard');return}
if(e.target.closest('#reportsBtn')){navigate('Reports');return}
if(e.target.closest('#settingsBtn')){navigate('Settings');return}
if(e.target.closest('#bell')){notificationPop();$('#notificationPop').classList.toggle('hidden');$('#bell').setAttribute('aria-expanded',String(!$('#notificationPop').classList.contains('hidden')));return}
if(e.target.closest('#profile')){$('#profilePop').classList.toggle('hidden');$('#profile').setAttribute('aria-expanded',String(!$('#profilePop').classList.contains('hidden')));return}
if(e.target.closest('#allNotifications')){navigate('Notifications');$('#notificationPop').classList.add('hidden');return}
let n=e.target.closest('[data-notification]');if(n){let item=notifications[Number(n.dataset.notification)];item.unread=false;renderNotificationCount();$('#notificationPop').classList.add('hidden');if(state.view==='Notifications')render();state.highlight=item.type==='Customer reply'?'replies':'';renderDrawer(item.id);return}
if(e.target.closest('#readAll')){notifications.forEach(n=>n.unread=false);render();toast('Notifications marked read');return}
let open=e.target.closest('[data-open]');if(open){rememberPosition();state.highlight=open.dataset.highlight||'';renderDrawer(open.dataset.open);$('#searchResults').classList.add('hidden');return}
if(e.target.closest('[data-add]')){addOrderDialog();return}
if(e.target.closest('#drawerClose')||e.target.id==='drawerBackdrop'){closeDrawer();return}
if(e.target.id==='modalBackdrop'){closeModal();return}
let action=e.target.closest('[data-action],[data-quick]');if(action){orderAction(action.dataset.action||action.dataset.quick,getOrder(action.dataset.id||state.selected));return}
if(e.target.closest('#sortDirection')){rememberPosition();state.descending=!state.descending;render();return}
let sort=e.target.closest('[data-sort]');if(sort){rememberPosition();let i=+sort.dataset.sort;if(state.sort===i)state.descending=!state.descending;else{state.sort=i;state.descending=false}render();return}
if(e.target.closest('#columnButton')){let pop=$('#columnPop');pop.classList.toggle('hidden');$('#columnButton').setAttribute('aria-expanded',String(!pop.classList.contains('hidden')));return}
let cell=e.target.closest('td.editable');if(cell&&!e.target.closest('input,select,textarea,button')){editCell(cell);return}
let report=e.target.closest('[data-report]');if(report){state.report=report.dataset.report;render();return}
let exp=e.target.closest('[data-export]');if(exp){exportRows(exp.dataset.export);return}
let drill=e.target.closest('[data-drill]');if(drill){state.reportFilters.worker=drill.dataset.drill;state.report='Order Lifecycle';render();return}
let setting=e.target.closest('[data-setting]');if(setting){state.setting=setting.dataset.setting;render();return}
if(e.target.closest('[data-employee-add]')){entityDialog('employee');return}
let employeeEdit=e.target.closest('[data-employee-edit]');if(employeeEdit){entityDialog('employee',+employeeEdit.dataset.employeeEdit);return}
let employeeToggle=e.target.closest('[data-employee-toggle]');if(employeeToggle){let x=employees[+employeeToggle.dataset.employeeToggle];x.active=!x.active;render();toast('Employee state updated in prototype');return}
let add=e.target.closest('[data-manager-add]');if(add){entityDialog(add.dataset.managerAdd);return}
let edit=e.target.closest('[data-manager-edit]');if(edit){let [kind,i]=edit.dataset.managerEdit.split('|');entityDialog(kind,+i);return}
let toggle=e.target.closest('[data-manager-toggle]');if(toggle){let [kind,i]=toggle.dataset.managerToggle.split('|');let item=(kind==='status'?statuses:methods)[+i];item[2]=!item[2];render();toast('Setting updated in prototype');return}
if(!e.target.closest('.global-wrap'))$('#searchResults').classList.add('hidden');
if(!e.target.closest('#bell,#notificationPop'))$('#notificationPop').classList.add('hidden');
if(!e.target.closest('#profile,#profilePop'))$('#profilePop').classList.add('hidden')
});
document.addEventListener('change',e=>{
if(e.target.id==='dashRange'){state.range=e.target.value;render()}
if(e.target.id==='listStatus'){rememberPosition();state.statusFilter=e.target.value;render()}
if(e.target.classList.contains('column-toggle')){rememberPosition();let i=+e.target.dataset.column;e.target.checked?state.hidden.delete(i):state.hidden.add(i);render()}
if(e.target.matches('[data-check]')){let o=getOrder(e.target.dataset.id),i=+e.target.dataset.check;update(o,keys[i],columns[i],e.target.checked)}
if(e.target.matches('[data-bl]')){let o=getOrder(e.target.dataset.bl);o.bl=e.target.checked;audit(o,'BL',!e.target.checked,e.target.checked);refreshAffected(o);toast(e.target.checked?'Blacklisted '+o.id:'Removed from blacklist '+o.id)}
if(e.target.id==='drawerShipping')update(getOrder(state.selected),'shipping','Shipping Method',e.target.value);
if(e.target.classList.contains('report-filter')){let key=e.target.id.slice(2);state.reportFilters[key]=e.target.value;render()}
if(e.target.id==='exportMonth'){state.exportMonth=e.target.value;render()}
if(e.target.id==='exportScope'){state.exportScope=e.target.value;render()}
if(e.target.classList.contains('preference-switch')){preferences[e.target.dataset.pref]=e.target.checked;toast('Preference updated in prototype')}
if(e.target.classList.contains('permission-switch')){permissions[e.target.dataset.permission]=e.target.checked;toast('Prototype permission updated · backend enforcement still required')}
if(e.target.classList.contains('general-setting'))toast('Preference illustrated for production settings')
});
document.addEventListener('input',e=>{
if(e.target.id==='globalSearch')searchResults();
if(e.target.id==='listSearch'){rememberPosition();state.filter=e.target.value;let position=e.target.selectionStart;render();let input=$('#listSearch');input.focus();input.setSelectionRange(position,position)}
if(e.target.id==='r-number'){state.reportFilters.number=e.target.value}
});
document.addEventListener('submit',e=>{
if(e.target.id==='addForm'){e.preventDefault();createOrder()}
if(e.target.id==='replyForm'){e.preventDefault();let o=getOrder(state.selected),text=$('#replyInput').value.trim();if(!text)return toast('Enter a reply.',true);let t=now();o.replies.push({body:text,by:actor(),at:t,unread:true});audit(o,'Customer Replies','Previous replies retained','New reply appended');o.csReply=t.slice(0,10);note('Customer reply',o,'New customer reply requires preparation review');refreshAffected(o);toast('Reply appended · customer wait cleared')}
if(e.target.id==='profileForm'){e.preventDefault();let name=$('#displayName').value.trim();if(!name)return toast('Enter a display name.',true);employees[0].name=name;render();toast('Display name updated for this session')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();$('#searchResults').classList.add('hidden');$('#notificationPop').classList.add('hidden');$('#profilePop').classList.add('hidden')}});
render();
  </script>
</body>
</html>
